<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Payment Confirmation</title>
    <link rel="stylesheet" href="/assets/payment-confirmation.css?v=1">
    <script defer src="/assets/store-pixels.js?v=9"></script>
    <script defer src="/assets/payment-success.js?v=2"></script>
  </head>
  <body>
    <main class="confirmation-container">
      <section class="confirmation-box">
        <svg xmlns="http://www.w3.org/2000/svg" height="100" width="100" viewBox="0 0 48 48" aria-hidden="true">
          <circle fill="#5bb543" cx="24" cy="24" r="22" />
          <path fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M14 27l5.917 4.917L34 17" />
        </svg>
        <p class="confirmation-message">Thank you for your payment! Your transaction has been successfully completed.</p>
        <div class="transaction-details">
          <p><strong>Transaction ID:</strong> <span id="transaction-id"></span></p>
          <p id="utr-row" hidden><strong>UTR:</strong> <span id="utr"></span></p>
          <p><strong>Amount:</strong> <span id="amount"></span></p>
          <p><strong>Paid Status:</strong> <span id="status"></span></p>
          <p><strong>Date:</strong> <span id="date"></span></p>
        </div>
        <a href="/" class="confirmation-button">Go to Home</a>
      </section>
    </main>
  </body>
</html>
